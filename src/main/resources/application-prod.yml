spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # HikariCP 메트릭 활성화
      register-mbeans: true
      pool-name: "HikariPool-Main"

  jpa:
    database: mysql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    defer-datasource-initialization: false
    open-in-view: true

  sql:
    init:
      mode: never

  security:
    user:
      name: ${MONITORING_USERNAME}
      password: ${MONITORING_USER_PASSWORD}

jwt:
  header: "Authorization"
  prefix: "Bearer"
  issuer: "ddingdong"
  secret: ${JWT_SECRET}
  expiration: 36000

logging:
  config: classpath:logback-${spring.profiles.active}.xml

sentry:
  dsn: ${SENTRY_DSN}
  environment: prod

server:
  tomcat:
    mbeanregistry:
      enabled: true
  port: 8080

# Actuator 설정
# 외부 Prometheus 스크랩(:9090)은 폐지. CloudWatch Agent가 로그/서버스펙을 수집하고,
# JVM 지표는 필요 시 서버에서 Actuator를 직접 조회한다. 헬스체크용 엔드포인트만 노출.
management:
  observations:
    enable:
      spring:
        security: false
  endpoints:
    web:
      exposure:
        include: health, info
      base-path: ${ACTUATOR_BASE_PATH}
    jmx:
      exposure:
        exclude: "*"
  server:
    port: 9090
  endpoint:
    health:
      show-details: never

cloud:
  aws:
    ses:
      configuration-set-name: "ddingdong-form-application-result-set-prod"
