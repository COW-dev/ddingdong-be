spring:
  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}

  jpa:
    database: mysql
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
    defer-datasource-initialization: false

  sql:
    init:
      mode: never

springdoc:
  api-docs:
    version: OPENAPI_3_0

jwt:
  header: "Authorization"
  prefix: "Bearer"
  issuer: "ddingdong"
  secret: ${JWT_SECRET}
  expiration: 36000

# dev도 로그 파일(logs/application.log)을 남겨 CloudWatch Agent가 tail 할 수 있게 한다.
logging:
  config: classpath:logback-dev.xml

# 헬스체크용 엔드포인트만 노출 (JVM 지표는 CloudWatch로 push하지 않음)
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

cloud:
  aws:
    ses:
      configuration-set-name: "ddingdong-form-application-result-set"
