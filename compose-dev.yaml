version: '3.8'
services:
  spring:
    image: public.ecr.aws/${DEV_ECR_REGISTRY_ALIAS}/dev-ecr:${VERSION:-latest}
    # EC2 재부팅(12h 스케줄 stop/start) 후 Docker 데몬이 컨테이너를 자동 재기동하도록 한다.
    restart: unless-stopped
    volumes:
      - mysql-volume:/var/lib/mysql
      - app-logs:/logs
    environment:
      - VERSION=${VERSION:-latest}
      - SPRING_PROFILES_ACTIVE=dev
    pull_policy: always
    env_file:
      - .env
    depends_on:
      - mysql
    ports:
      - "8080:8080"

  mysql:
    image: mysql:8.4.6
    # EC2 재부팅(12h 스케줄 stop/start) 후 자동 재기동.
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ddingdong
      MYSQL_ROOT_PASSWORD: ${DEV_DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-volume:/var/lib/mysql

  # 자체호스팅 모니터링을 대체해 dev 로그(logs/application.log)를 CloudWatch Logs로 전송.
  # app-logs 볼륨을 spring 컨테이너와 공유해 tail 한다.
  # 필요 자격증명: dev EC2에 IAM 역할(로그 write 권한) 부착 권장. 역할이 없으면
  #                .env 의 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 로 인증한다.
  cloudwatch-agent:
    image: amazon/cloudwatch-agent:latest
    container_name: cloudwatch-agent
    restart: unless-stopped
    environment:
      - AWS_REGION=ap-northeast-2
    env_file:
      - .env
    volumes:
      - app-logs:/logs:ro
      - ./cloudwatch/dev-cloudwatch-agent.json:/etc/cwagentconfig/cwagentconfig.json:ro

volumes:
  mysql-volume:
    external: true
  app-logs:
